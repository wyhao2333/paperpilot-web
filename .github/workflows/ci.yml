name: Reader checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-24.04-arm
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/audit_dependencies.py
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=low --registry=https://registry.npmjs.org
        working-directory: frontend
      - name: Docker smoke check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export APP_ORIGIN=http://localhost:8765 APP_SECURE_COOKIES=auto
          trap 'docker compose -p paperpilot-ci down --volumes' EXIT
          docker compose -p paperpilot-ci build --pull
          docker compose -p paperpilot-ci up -d --wait --wait-timeout 120
          docker compose -p paperpilot-ci exec -T paperpilot python < tests/container_smoke.py
          docker compose -p paperpilot-ci exec -T parser python -c "import os,pathlib; assert os.getuid()==10002; assert not pathlib.Path('/app/data/secret.key').exists(); assert not pathlib.Path('/app/data/paperpilot.sqlite3').exists()"
