name: Reader checks
on: [push, pull_request]

jobs:
  checks:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Docker smoke check (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build -t paperpilot-web:ci .
          docker run -d --name paperpilot-smoke -p 127.0.0.1:8765:8765 paperpilot-web:ci
          trap 'docker rm -f paperpilot-smoke' EXIT
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8765/api/health; then exit 0; fi
            sleep 2
          done
          docker logs paperpilot-smoke
          exit 1
